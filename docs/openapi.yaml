openapi: 3.1.0
info:
  title: Gym Tracker API
  version: 0.1.0
paths:
  /v1/health:
    get:
      responses:
        '200':
          description: OK
  /v1/auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
                deviceName: { type: string }
                deviceKind: { type: string }
      responses:
        '200':
          description: OK
  /v1/auth/refresh:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: OK
  /v1/devices:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /v1/devices/{id}/revoke:
    post:
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No Content
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
